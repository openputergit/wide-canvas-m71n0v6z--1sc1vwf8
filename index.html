<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dairy Product Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3498db;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-blue-50">
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold">Dairy Management System</h1>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <!-- Data Entry Form -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Add New Entry</h2>
            <form id="dairyForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Product Name</label>
                    <input type="text" id="productName" class="w-full p-2 border rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Customer Name</label>
                    <input type="text" id="customerName" class="w-full p-2 border rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Provider Name</label>
                    <input type="text" id="providerName" class="w-full p-2 border rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Price (₹)</label>
                    <input type="number" id="price" class="w-full p-2 border rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Quantity</label>
                    <input type="number" id="quantity" class="w-full p-2 border rounded" required>
                </div>
                <div class="flex items-end">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                        Add Entry
                    </button>
                    <div class="loader ml-3" id="submitLoader"></div>
                </div>
            </form>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Product Records</h2>
                <div class="loader" id="tableLoader"></div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full table-auto">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Product</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Customer</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Provider</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quantity</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="dairyTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Data will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const userId = localStorage.getItem('userId') || 'user_' + Math.random().toString(36).substr(2, 9);
        const appSlug = 'dairy-management-system';
        
        // Save userId if not exists
        if (!localStorage.getItem('userId')) {
            localStorage.setItem('userId', userId);
        }

        async function fetchData() {
            document.getElementById('tableLoader').style.display = 'block';
            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/db', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer S9oOaaAJHuTwFcPaZAq3PiDjkjE3',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: userId,
                        appSlug: appSlug,
                        action: 'read',
                        table: 'dairy_products'
                    })
                });
                const result = await response.json();
                renderTable(result.data || []);
            } catch (error) {
                console.error('Error fetching data:', error);
            } finally {
                document.getElementById('tableLoader').style.display = 'none';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('dairyTableBody');
            tbody.innerHTML = '';
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">${item.data.productName}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${item.data.customerName}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${item.data.providerName}</td>
                    <td class="px-6 py-4 whitespace-nowrap">₹${item.data.price}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${item.data.quantity}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <button onclick="deleteEntry('${item.id}')" class="text-red-600 hover:text-red-800">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        document.getElementById('dairyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('submitLoader').style.display = 'block';

            const formData = {
                productName: document.getElementById('productName').value,
                customerName: document.getElementById('customerName').value,
                providerName: document.getElementById('providerName').value,
                price: document.getElementById('price').value,
                quantity: document.getElementById('quantity').value
            };

            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/db', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer S9oOaaAJHuTwFcPaZAq3PiDjkjE3',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: userId,
                        appSlug: appSlug,
                        action: 'create',
                        table: 'dairy_products',
                        data: formData
                    })
                });
                
                if (response.ok) {
                    e.target.reset();
                    fetchData();
                }
            } catch (error) {
                console.error('Error adding entry:', error);
            } finally {
                document.getElementById('submitLoader').style.display = 'none';
            }
        });

        async function deleteEntry(id) {
            if (!confirm('Are you sure you want to delete this entry?')) return;
            
            document.getElementById('tableLoader').style.display = 'block';
            try {
                const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/db', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer S9oOaaAJHuTwFcPaZAq3PiDjkjE3',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: userId,
                        appSlug: appSlug,
                        action: 'delete',
                        table: 'dairy_products',
                        id: id
                    })
                });
                
                if (response.ok) {
                    fetchData();
                }
            } catch (error) {
                console.error('Error deleting entry:', error);
            }
        }

        // Initial data fetch
        fetchData();
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
